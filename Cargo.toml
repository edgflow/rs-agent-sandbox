[package]
name = "agent-sandbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "An AI coding agent whose shell commands run where we decide"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "process", "time"] }
